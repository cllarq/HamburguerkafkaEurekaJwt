services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka-burger
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres:
    image: postgres:16-alpine
    container_name: postgres-burger
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: burger_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123

  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/config-repo
    environment:
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"

  burger-productor:
    build: ./burguer-productor
    container_name: burger-productor
    ports:
      - "8081:8081"
    depends_on:
      - kafka
      - config-server
      - eureka-server
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  burger-consumidor:
    build: ./burguer-consumidor
    container_name: burger-consumidor
    ports:
      - "8082:8082"
    depends_on:
      - kafka
      - postgres
      - eureka-server
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_URL: jdbc:postgresql://postgres:5432/burger_db?sslmode=disable

  burger-gateway:
    build: ./burguer-gateway
    container_name: burger-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - burger-productor
    environment:
      SPRING_PROFILES_ACTIVE: docker
